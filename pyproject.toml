[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system-b3"
version = "0.1.0"
description = "Sistema de Swing Trade Automatizado B3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pywebview>=5.3; sys_platform == 'win32'",
    "MetaTrader5; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ts.app" = ["web/*", "web/vendor/*"]
"ts.persistence" = ["migrations/*.sql"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "mt5: tests that require an active MetaTrader 5 terminal connection"
]
addopts = "-m 'not mt5'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
