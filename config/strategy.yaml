min_history_bars: 260   # PRD 1.1.5: ativos com menos de 260 barras ficam fora do universo
asset_trend_sma: 200

market_filter:
  ibov_sma_long: 200
  ibov_sma_short: 50
  require_bull_regime: true

pivot:
  window_n: 2
  magnitude_atr_k: 1.0
  atr_period: 14

setups:
  A:
    name: "Pivo_de_Alta"
    trade_class: "TREND"
    enabled: true
    adx_threshold: 20.0
    rvol_min: 1.5
    entry_type: "OPEN_AUCTION"
    trailing_chandelier_k: 3.0
    chandelier_atr_period: 22
    stagnation_bars: 15
    stagnation_mfe_r: 1.0

  B:
    name: "Pullback"
    trade_class: "MEAN_REVERSION"
    enabled: true
    ema_short: 20
    sma_medium: 50
    pullback_bars_min: 2
    pullback_bars_max: 5
    rsi_period: 14
    rsi_max: 45.0
    adx_recent_bars: 10
    adx_threshold: 20.0
    entry_type: "BUY_STOP"
    partial_target_r: 1.5
    partial_pct: 0.50
    final_target_r: 3.0
    time_stop_bars: 8
    min_rr_filter: 3.0

  C:
    name: "Donchian_20_10"
    trade_class: "TREND"
    enabled: false   # lab 2026-11-17: E[R] -0,24..-0,37 com dividendos; desligar cortou o DD de 16,9% p/ 11,9%
    donchian_entry_period: 20
    donchian_exit_period: 10
    adx_threshold: 20.0
    rvol_min: 1.5
    entry_type: "OPEN_AUCTION"
    stagnation_bars: 15
    stagnation_mfe_r: 1.0

  D:
    name: "Bollinger_Squeeze"
    trade_class: "TREND"
    enabled: false   # lab 2026-11-17: acerto 13-22%, E[R] -0,42..-0,62; 35% estopado em <= 3 pregões
    bollinger_period: 20
    bollinger_std: 2.0
    bollinger_ddof: 0
    squeeze_lookback: 120
    squeeze_percentile_q: 10.0
    rvol_min: 1.5
    entry_type: "OPEN_AUCTION"
    trailing_chandelier_k: 3.0
    chandelier_atr_period: 22
    stagnation_bars: 15
    stagnation_mfe_r: 1.0

  E:
    name: "Divergencia_Alta"
    trade_class: "MEAN_REVERSION"
    enabled: true
    bars_between_pivots_min: 5
    bars_between_pivots_max: 30
    price_tolerance: 1.005
    rsi_delta_min: 3.0
    rsi_period: 14
    entry_type: "BUY_STOP"
    partial_target_r: 1.5
    partial_pct: 0.50
    final_target_r: 3.0
    time_stop_bars: 8
    min_rr_filter: 3.0

  # Reversão em mercado de baixa (IFR2 de Connors). Só opera com o IBOV em BAIXA (fecha < MM200 e MM50 < MM200),
  # quando A–E estão bloqueados. Lab 2026-11-17: +1,04%/op na descoberta 2019-23 e +1,04% na prova 2024-26
  # (só regime de baixa); em ALTA/LATERAL a mesma regra perde.
  # Ligado em 2026-11-17 em PAPER (experimento): motor completo 2019-26 com todas as proteções: 401 op., acerto 62%,
  # E[R] +0,056 (IC -0,01..+0,12), retorno +11,7% vs -1,9% sem F, DD 14,7%. AINDA NÃO PASSA NO G0 (IC e DSR).
  F:
    name: "Reversao_Baixa"
    trade_class: "MEAN_REVERSION"
    enabled: true
    rsi_period: 2
    rsi_max: 10.0
    exit_sma: 5
    time_stop_bars: 10
    stop_atr_k: 2.8
    entry_type: "OPEN_AUCTION"

  # Força de longo prazo + virada no diário (lab multi-tempo 2026-11-17, ideia do trader):
  # IFR(14) MENSAL (só meses encerrados) >= 60 e o histograma do MACD(12,26,9) diário cruza acima de zero.
  # Opera em qualquer regime do IBOV (o IFR mensal é o filtro de tendência). Stop 2,8 ATR; Chandelier 3 ATR(22)
  # desde a entrada. Motor completo 2019-26 (A+B+F+G): 520 op., E[R] +0,088 (IC +0,01..+0,17), +27,6%, DD 15,4%;
  # prova 2024+ +6,6% (vs +3,0% sem G). Platô 50/60/70 positivo. PAPER experimental: DSR 0,70 < 0,95 (G0 ainda reprova).
  G:
    name: "Mensal_Forte_MACD"
    trade_class: "TREND"
    enabled: true
    rsi_month_period: 14
    rsi_month_min: 60.0
    stop_atr_k: 2.8
    trailing_chandelier_k: 3.0
    all_regimes: true
    entry_type: "OPEN_AUCTION"

risk:
  risk_per_trade_pct: 0.01
  stop_atr_min_k: 1.0
  stop_atr_max_k: 3.0
  capital_cap_pct: 0.20
  gap_cap_pct: 0.02
  default_gap_p01: 0.035
  gap_lookback_days: 500
  round_lot: 100
  tick_size: 0.01
  min_risk_efficiency: 0.70
  auction_limit_protection_pct: 0.03
  max_entry_risk_overshoot_pct: 0.0   # gap acima do teto de risco = ordem não executa

portfolio:
  max_heat_pct: 0.05
  max_correlated_risk_pct: 0.03
  max_positions_per_cluster: 2
  cluster_correlation_threshold: 0.70
  max_beta: 1.20
  correlation_lookback_days: 60
  beta_lookback_days: 120
  relative_strength_days: 60

regime:
  lookback_years: 5
  realized_vol_days: 20
  tiers:
    - max_percentile: 50.0
      risk_multiplier: 1.00
      heat_max_pct: 0.05
    - max_percentile: 80.0
      risk_multiplier: 0.75
      heat_max_pct: 0.04
    - max_percentile: 95.0
      risk_multiplier: 0.50
      heat_max_pct: 0.025
    - max_percentile: 100.0
      risk_multiplier: 0.00
      heat_max_pct: 0.00

protections:
  cooldown_stops_count: 2
  cooldown_lookback_days: 30
  cooldown_pause_days: 10
  setup_monitor_window: 30
  setup_bootstrap_quantile: 0.05
  circuit_breaker_dd_level1: 0.08
  circuit_breaker_dd_level2: 0.12
  circuit_breaker_level1_risk_multiplier: 0.50
  shadow_sma_period: 20
  quarantine_consecutive_losses: 6   # quarentena por sequência de perdas (0 desliga)
  setup_resume_trades: 20            # setup suspenso volta sozinho se as últimas 20 op. na sombra tiverem média > 0 (0 = só manual)
  cusum_k_sigma: 0.5
  cusum_h_sigma: 5.0

# Roteador de regime (Tratado: Diamante, eficiência de Kaufman, amplitude).
# Ligado em 2026-11-17 junto com C/D desligados: no lab (A+B) E[R] -0,020 -> +0,005 e DD 8,4%.
# Ainda NÃO passa no G0 (IC inclui zero, DSR 0,14) — decisão de proteção de capital, não de edge.
regime_router:
  enabled: true
  er_period: 10
  er_trend_min: 0.30
  breadth_min_pct_above_sma50: 0.0
  rules:
    A: {phases: [2, 3], trend_only: true}
    B: {phases: [3], trend_only: false}
    C: {phases: [2, 3], trend_only: true}
    D: {phases: [2, 3], trend_only: false}
    E: {phases: [3, 4], trend_only: false}
